map:
  dimensions: [15, 15] 
  
  obstacles:
  # Croce centrale statica (lascia l'anello esterno x=0, x=14, y=0, y=14 libero)
  # Braccio Verticale (x=7) - Lascia buchi a y=4, y=7, y=10
  - [7, 1]
  - [7, 2]
  - [7, 3]
  - [7, 5]
  - [7, 6]
  - [7, 8]
  - [7, 9]
  - [7, 11]
  - [7, 12]
  - [7, 13]
  # Braccio Orizzontale (y=7) - Lascia buchi a x=4, x=7, x=10
  - [1, 7]
  - [2, 7]
  - [3, 7]
  - [5, 7]
  - [6, 7]
  - [8, 7]
  - [9, 7]
  - [11, 7]
  - [12, 7]
  - [13, 7]

  movable_obstacles:
  # "Tappi" che chiudono i varchi segreti tra le stanze
  - [7, 4]  # Porta Nord-Sud (Sinistra)
  - [7, 10] # Porta Nord-Sud (Destra)
  - [4, 7]  # Porta Est-Ovest (Basso)
  - [10, 7] # Porta Est-Ovest (Alto)
  
  
  non_task_endpoints:
  # I 4 angoli estremi (garantiscono well-formedness uniti dall'anello perimetrale)
  - [0, 0]
  - [0, 14]
  - [14, 0]
  - [14, 14]
  - [1, 1]   # Stanza Basso-Sinistra
  - [13, 1]  # Stanza Basso-Destra
  - [1, 13]  # Stanza Alto-Sinistra
  - [13, 13] # Stanza Alto-Destra
  # Angoli profondi ciechi a ridosso del centro nevralgico della croce
  - [6, 6]   # Stanza Basso-Sinistra
  - [8, 6]   # Stanza Basso-Destra
  - [6, 8]   # Stanza Alto-Sinistra
  - [8, 8]   # Stanza Alto-Destra
  
  start_locations:
  # Centri profondi delle 4 stanze
  - [3, 3]   # Stanza Basso-Sinistra
  - [11, 3]  # Stanza Basso-Destra
  - [3, 11]  # Stanza Alto-Sinistra
  - [11, 11] # Stanza Alto-Destra
  - [1, 6]   # Muro orizzontale sx, parte bassa
  - [6, 1]   # Muro verticale basso, parte sx
  - [8, 1]   # Muro verticale basso, parte dx
  - [13, 6]  # Muro orizzontale dx, parte bassa
  - [1, 8]   # Muro orizzontale sx, parte alta
  - [6, 13]  # Muro verticale alto, parte sx
  - [8, 13]  # Muro verticale alto, parte dx
  - [13, 8]  # Muro orizzontale dx, parte alta
  
  goal_locations:
  - [3, 3]
  - [11, 3]
  - [3, 11]
  - [11, 11]
  - [1, 6]   # Muro orizzontale sx, parte bassa
  - [6, 1]   # Muro verticale basso, parte sx
  - [8, 1]   # Muro verticale basso, parte dx
  - [13, 6]  # Muro orizzontale dx, parte bassa
  - [1, 8]   # Muro orizzontale sx, parte alta
  - [6, 13]  # Muro verticale alto, parte sx
  - [8, 13]  # Muro verticale alto, parte dx
  - [13, 8]  # Muro orizzontale dx, parte alta

