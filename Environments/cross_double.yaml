agents:
  - name: 'agent0'
    start: [1, 4]
  - name: 'agent1'
    start: [4, 1]
  - name: 'agent2'
    start: [8, 4]
  - name: 'agent3'
    start: [4, 8]

map:
  dimensions: [10, 10]
  
  obstacles:
    # Blocco in alto a sx (NW)
    - [1, 1]
    - [2, 1]
    - [3, 1]
    - [1, 2]
    - [2, 2]
    - [3, 2]
    - [1, 3]
    - [2, 3]
    - [3, 3]

    # Blocco in alto a dx (NE)
    - [6, 1]
    - [7, 1]
    - [8, 1]
    - [6, 2]
    - [7, 2]
    - [8, 2]
    - [6, 3]
    - [7, 3]
    - [8, 3]

    # Blocco in basso a sx (SW)
    - [1, 6]
    - [2, 6]
    - [3, 6]
    - [1, 7]
    - [2, 7]
    - [3, 7]
    - [1, 8]
    - [2, 8]
    - [3, 8]

    # Blocco in basso a dx (SE)
    - [6, 6]
    - [7, 6]
    - [8, 6]
    - [6, 7]
    - [7, 7]
    - [8, 7]
    - [6, 8]
    - [7, 8]
    - [8, 8]

  movable_obstacles:
    # Ostacoli esattamente al centro a saturare l'incrocio (2x2)
    - [4, 4]
    - [5, 4]
    - [4, 5]
    - [5, 5]
    # - [3, 4]
    # - [3, 5]
    # - [4, 6]
    # - [5, 6]
    # - [6, 4]
    # - [6, 5]
    # - [4, 3]
    # - [5, 3]

  non_task_endpoints:
    # Sinistra
    - [1, 4]
    - [1, 5]
    # Destra
    - [8, 4]
    - [8, 5]
    # Alto
    - [4, 1]
    - [5, 1]
    # Basso
    - [4, 8]
    - [5, 8]

  start_locations:
    - [1, 4]
    - [1, 5]
    - [8, 4]
    - [8, 5]
    - [4, 1]
    - [5, 1]
    - [4, 8]
    - [5, 8]

  goal_locations:
    - [1, 4]
    - [1, 5]
    - [8, 4]
    - [8, 5]
    - [4, 1]
    - [5, 1]
    - [4, 8]
    - [5, 8]

tasks:
  # Batch 1: Incrocio frontale classico
  - task_name: 'task0'
    start_time: 0
    start: [1, 4]
    goal: [8, 4]
  - task_name: 'task1'
    start_time: 2
    start: [4, 1]
    goal: [4, 8]

  # Batch 2: Ritorni
  - task_name: 'task2'
    start_time: 15
    start: [8, 5]
    goal: [1, 5]
  - task_name: 'task3'
    start_time: 17
    start: [5, 8]
    goal: [5, 1]

  # Batch 3: Curve a 90 gradi (Testano come spingono l'ostacolo lateralmente)
  - task_name: 'task4'
    start_time: 30
    start: [1, 4]
    goal: [4, 1]
  - task_name: 'task5'
    start_time: 32
    start: [8, 5]
    goal: [5, 8]

  # Batch 4: Rientro dalle curve
  - task_name: 'task6'
    start_time: 45
    start: [4, 1]
    goal: [8, 4]
  - task_name: 'task7'
    start_time: 47
    start: [5, 8]
    goal: [1, 5]

  # Batch 5: Ultimo scontro frontale
  - task_name: 'task8'
    start_time: 60
    start: [1, 4]
    goal: [8, 4]
  - task_name: 'task9'
    start_time: 62
    start: [4, 1]
    goal: [4, 8]

delays:
  agent0: []
  agent1: []
  agent2: []

n_tasks: 10
task_freq: 10
n_delays_per_agent: 0